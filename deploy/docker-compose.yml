# InterviewMate — the ATS and emotion services on one server, behind Caddy.
# The frontend, the Express API and the interview service run on Vercel.
#
# Run from this directory:  docker compose up -d --build
#
# Each service reads its secrets from its own .env file (same layout as local
# dev). Values under `environment:` override anything in those files.

services:
  ats:
    build:
      context: "../models/Resume ATS and JD/api_service"
    env_file: "../models/Resume ATS and JD/api_service/.env"
    environment:
      PORT: 6050
    restart: unless-stopped

  emotion:
    build:
      context: ../models/Audio_Emotion_Analysis
    env_file:
      # Optional: holds SERVICE_TOKEN_SECRET.
      - path: ../models/Audio_Emotion_Analysis/.env
        required: false
    environment:
      PORT: 8090
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - ats
      - emotion

volumes:
  caddy_data:
  caddy_config:
