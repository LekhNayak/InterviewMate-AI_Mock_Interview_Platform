# InterviewMate — the ATS service on one server, behind Caddy. Optional: the ATS service also runs on Vercel.
# The frontend, the Express API and the interview service run on Vercel. The voice analysis runs in the browser.
#
# Run from this directory:  docker compose up -d --build --remove-orphans
# (--remove-orphans also stops the emotion service container that older versions of this file ran.)
#
# The service reads its secrets from its own .env file (same layout as local
# dev). Values under `environment:` override anything in that file.

services:
  ats:
    build:
      context: "../models/Resume ATS and JD/api_service"
    env_file: "../models/Resume ATS and JD/api_service/.env"
    environment:
      PORT: 6050
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - ats

volumes:
  caddy_data:
  caddy_config:
