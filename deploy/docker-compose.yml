# InterviewMate — the three Python services on one Oracle Cloud Ampere A1 VM
# (ARM64), behind Caddy. The frontend and the Express API run on Vercel.
#
# Run from this directory:  docker compose up -d --build
#
# Each service reads its secrets from its own .env file (same layout as local
# dev). Values under `environment:` override anything in those files.

services:
  interview:
    build:
      context: "../models/Interview api_service"
    env_file: "../models/Interview api_service/.env"
    environment:
      PORT: 5000
    volumes:
      # Live sessions and feedback are JSON files here. The volume keeps
      # interviews in progress through a rebuild.
      - interview_data:/app/data
    restart: unless-stopped

  ats:
    build:
      context: "../models/Resume ATS and JD/api_service"
    env_file: "../models/Resume ATS and JD/api_service/.env"
    environment:
      PORT: 6050
    restart: unless-stopped

  emotion:
    build:
      context: ../models/Audio_Emotion_Analysis
    env_file:
      # Optional: holds SERVICE_TOKEN_SECRET.
      - path: ../models/Audio_Emotion_Analysis/.env
        required: false
    environment:
      PORT: 8090
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - interview
      - ats
      - emotion

volumes:
  interview_data:
  caddy_data:
  caddy_config:
